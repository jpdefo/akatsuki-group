name: Daily data refresh

on:
  schedule:
    # 06:00 UTC every day. Adjust the time if you want a different hour.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      # Node is needed by the static export to precompute api/derived.json via
      # the shared calc code (tools/build-derived.mjs). Without it the export
      # still succeeds but skips the precompute and the site computes live.
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Hydrate Steam media cache
        run: python server.py --hydrate-sync-media --recent-days 365
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}

      # Progress refresh also refreshes + saves the Steam library internally
      # (account-wide GetOwnedGames per active member), so a separate library
      # step would just double those playtime calls. Achievements are fetched
      # only for games won by active members.
      - name: Refresh Steam progress (library + achievements)
        run: python server.py --refresh-steam-progress --full-refresh
        env:
          STEAM_WEB_API_KEY: ${{ secrets.STEAM_WEB_API_KEY }}

      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "No data changes to commit."
          else
            git commit -m "Daily data refresh"
            git push
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Export static site
        run: python server.py --export-static --output-dir dist

      - name: Validate static snapshot
        run: python server.py --validate-static --output-dir dist

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
