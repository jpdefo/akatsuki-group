<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Akatsuki Giveaways</title>
    <link rel="icon" type="image/png" href="akatsuki.png" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="hero">
        <div class="hero-identity">
          <img class="hero-logo" src="akatsuki.png" alt="Akatsuki" />
          <div>
            <h1>Akatsuki Giveaways</h1>
            <p class="hero-copy">Every synced giveaway</p>
          </div>
        </div>
        <div class="hero-actions page-nav" data-page-nav></div>
      </header>

      <main class="grid">
        <section class="card sync-card">
          <div class="sync-bar">
            <h2 class="sync-bar-title">Automatic sync</h2>
            <div id="sync-status" class="sync-status"></div>
          </div>
        </section>

        <section class="card">
          <div class="section-heading">
            <div>
              <h2>All giveaways</h2>
              <p id="giveaways-summary" class="section-copy">Loading giveaways…</p>
            </div>
            <div class="section-filters">
              <label class="inline-filter">
                Search
                <input id="giveaways-search" type="search" placeholder="Title, creator or winner" />
              </label>
              <label class="inline-filter">
                Type
                <select id="giveaways-kind-filter">
                  <option value="all">All types</option>
                  <option value="cycle">Cycle</option>
                  <option value="extra">Extra</option>
                  <option value="pop_free">PoP Free</option>
                  <option value="penalty">Penalty</option>
                  <option value="summer_event">Summer event</option>
                </select>
              </label>
              <label class="inline-filter">
                Month
                <select id="giveaways-month-filter">
                  <option value="all">All months</option>
                </select>
              </label>
              <label class="inline-filter">
                Sort
                <select id="giveaways-sort">
                  <option value="ended-desc">End time (latest first)</option>
                  <option value="ended-asc">End time (earliest first)</option>
                  <option value="creator-asc">Creator A-Z</option>
                  <option value="creator-desc">Creator Z-A</option>
                  <option value="winner-asc">Winner A-Z</option>
                  <option value="winner-desc">Winner Z-A</option>
                  <option value="title-asc">Title A-Z</option>
                  <option value="title-desc">Title Z-A</option>
                  <option value="entries-desc">Most entries</option>
                  <option value="entries-asc">Least entries</option>
                </select>
              </label>
            </div>
          </div>
          <div class="table-wrap">
            <table class="dense-table">
              <thead>
                <tr>
                  <th>Game</th>
                  <th>Giveaway</th>
                  <th>Creator</th>
                  <th>Month</th>
                  <th>Type</th>
                  <th>Winner</th>
                  <th>Entries</th>
                </tr>
              </thead>
              <tbody id="all-giveaways-table"></tbody>
            </table>
          </div>
        </section>
      </main>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
